[project]
name = "wnc-ebay-csv-generator"
version = "1.0.0"
description = "WNC Parts Slingers — eBay Motors CSV Listing Generator"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "cloudinary>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "google-generativeai>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
